services:
  frontend:
    build: ./my-project
    networks:
      - swapify-net

  backend1:
    build: ./backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    environment:
      - INSTANCE_NAME=backend1
    depends_on:
      - db
    networks:
      - swapify-net

  backend2:
    build: ./backend
    ports:
      - "3002:3000"
    env_file:
      - ./backend/.env
    environment:
      - INSTANCE_NAME=backend2
    depends_on:
      - db
    networks:
      - swapify-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf         
      - ./my-project/dist:/usr/share/nginx/html           
      - /dev/null:/etc/nginx/conf.d/default.conf        
    depends_on:
      - frontend
      - backend1
      - backend2
    networks:
      - swapify-net

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swapify
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./swapify_dump.backup:/docker-entrypoint-initdb.d/swapify_dump.backup
    networks:
      - swapify-net

volumes:
  pgdata:

networks:
  swapify-net:
